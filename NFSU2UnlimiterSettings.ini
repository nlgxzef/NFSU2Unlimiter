[Main]
ReplacementCar = 1                  // CarTypeID used for replacement if the model cannot be found or is invalid. (Default = 1 = FOCUS)
AllNewCarsInitiallyUnlocked = 0     // Unlocks all add-on cars set as racers from the beginning. If true, it will override the options in UnlimiterData folder. (0 = False (Default), 1 = True)
AllNewCarsCanBeDrivenByAI = 0       // Makes all add-on cars set as racers available for AI opponents. If true, it will override the options in UnlimiterData folder. (0 = False (Default), 1 = True)
RandomNameHook = 1                  // Uses RACERNAME_XXX strings to un-hardcode the AI opponents names for Quick Race events. (0 = False, 1 = True (Default))

[Fixes]
DisappearingWheelsFix = 1           // Fixes disappearing wheels when lost focus. Useful for open-wheel cars. (0 = False, 1 = True (Default))
WorldCrashFixes = 1                 // Increases various game world trigger limits from 64 to 127 to fix crashes. (0 = False, 1 = True (Default))
CabinNeonFix = 1                    // Fixes the game code which prevents cabin neons from appearing on the car. (0 = False, 1 = True (Default))
RaceEngageDialogFix = 1             // Allows using event-specific engage messages if they exist, regardless from the stage. (0 = False, 1 = True (Default))
FNGFix = 0                          // Fixes missing objects for options and stuff in FNGs by cloning them. Configurable via UnlimiterData\_FNGFixes.ini file. (0 = False (Default), 1 = True)
StreamingTrafficCarManagerFix = 1   // Fixes random car skin assignment for traffic cars and relocates the Streaming Traffic Car Manager to allow add-on traffic cars. (0 = False, 1 = True (Default))
AccumulateTireOffsets = 1           // FRONT_TIRE_OFFSET and REAR_TIRE_OFFSET from the fender and quarter add on top of the widebody one, which is what v4 does. Set to 0 for v3 behaviour, where the widebody value is used on its own and the fender and quarter only apply without one. Affects where the wheel sits relative to the brake. (0 = False, 1 = True (Default))
HideSpecialtiesInGarage = LicensePlate   // Which Specialties entries the career garage leaves out, as a comma separated list of CustomGauges, Neon, WindowTint, HeadlightColor, NosPurge, ExhaustFlame, TireSmoke, Hydraulics, TrunkAudio, Spinners, SplitHoods, Doors, LicensePlate. Use it for the ones that do not survive a purchase, so the garage stops behaving like a shop with no prices. 1 hides all of them, 0 hides none. (Default = LicensePlate)
EngineSFXGuard = 1                  // Drops a car engine sound object that has been freed while still on CARSFX_EngineBase's pending load stack. Nothing ever removes such an entry, so the audio update drives into memory the pool has taken back, which crashes outright and wrecks pool 0 on the way. Writes what it dropped to UnlimiterData\_EngineSFXGuard.txt. (0 = False, 1 = True (Default))
AIEngineBankFix = 1                 // Keeps the engine sound entry an AI car was actually assigned. EAXAITunerCar::ConnectCar hands a car the next bank in LoadedAIEngineBanks whenever its own is not in those six slots, which overwrites the car's own choice for good, so opponents end up wearing each other's engines. Also bounds checks the append that fills the array. (0 = False, 1 = True (Default))

[Sound]
CarSoundTuner = 1                   // Enables Car Sound Tuner to make car sounds configurable via UnlimiterData\CarSoundData directory instead of using hardcoded values in the executable. (0 = False, 1 = True (Default))
BigFileVFSHandlePoolSize = 64       // Expands reserved slots used for the files read inside SDATA\sdat.viv to fix NIS audio related crashes. (12 = Vanilla Default, 64 = Unlimiter Default, 127 = Maximum)
SerializeBigFileVFS = 1             // Serializes opens and closes on that same VFS. Its two lists are edited with no lock at all while three threads open and close through them, which is what tore the free list apart and faulted the game at 0x6F6AF9 and 0x6F80B6. Leave on unless you are chasing that behaviour on purpose. (0 = False, 1 = True (Default))
SkipLegacyCSTCheck = 0              // Skips checking for Legacy Car Sound Tuner. (0 = False (Default), 1 = True)
UpgradeFromLegacyCST = 0            // Forces upgrading Car Sound Data from Legacy Car Sound Tuner to Unlimiter, even when Legacy Car Sound Tuner is disabled. Gets disabled automatically after the data gets upgraded. (0 = False (Default), 1 = True)
ExportCarSoundData = 0              // Exports default values into UnlimiterData\CarSoundData. Overwrites any existing files. Gets disabled automatically after the data gets exported. (0 = False (Default), 1 = True)

[Misc]
ExpandMemoryPools = 1               // Expands memory area of the game and fixes flickering problem. (0 = False, 1 = True (Default))
ForceStockPartsOnAddOnOpponents = 0 // Forces Stock Parts for Add-On Cars to fix Missing Parts on Opponents' Cars. (0 = False (Default), 1 = True)
ExtendFeCarLimits = 0               // Replaces the front end car database accessors. Stock cars past the game's own 48 are then built into an unlimited list instead of being dropped, and tuned cars go from 20 to 40. Leave off unless you need those: with it on, editing a sponsor car has been seen to fault inside the game's own car lookup. (0 = False (Default), 1 = True)
StaticCameraGenericFallback = 1     // Uses the catch-all _Sedans / _SUVs static camera entry for cars with no entry of their own. (0 = False, 1 = True (Default))
SortStockCarsByStage = 0            // Orders the dealership by the career stage of the event that awards each car, cars no event awards last. Requires ExtendFeCarLimits. (0 = False (Default), 1 = True)
FilterDecalsByInitials = 0          // Filters decals by initials instead of their color. Use Left and Right triggers ([] on keyboard) to switch between letters @-Z.  (0 = False (Default), 1 = True, 2 = All + Letters)
AllowExcludedDecals = 0             // Lets a decal show on a part whose EXCLUDEDECAL attribute forbids it, which is what aftermarket hoods use to suppress hood decals. The Decal Shop offers and charges for those layouts either way, so without this you can buy a hood decal that never appears. Off by default because the layout is authored for the stock hood and can end up inside a taller one, so check the result before leaving it on. (0 = False (Default), 1 = True)
KeepHoodDecals = 1                  // Stops a hood decal being wiped the moment you fit an aftermarket hood. CarCustomizeManager::InstallPart calls UninstallHoodDecals for any hood above tier 0, so vanilla only lets the stock hood wear one. (0 = False, 1 = True (Default))
ChargeForGauges = 1                 // Prices custom gauges. They are tier 0 parts with no COST attribute, and the cost path only prices a tier 0 part if it is a decal, so vanilla hands them out free. (0 = False, 1 = True (Default))
GarageShowsOwnedPartsOnly = 0       // Keeps the career garage to parts that were actually bought. The game already asks for the owned only filter there, but CareerUnlocker::IsCarPartUnlocked reads it as owned OR untiered, and most visual parts carry no tier, so the garage lists things nobody paid for. Whatever is on the car now is never hidden. (0 = False (Default), 1 = True)
ShowDebugCarCustomize = 0           // Adds the Debug Car Customize option to the customize category menu. If you have Extra Options installed, disable this option to follow ShowDebugCarCustomize option in Extra Options' configuration instead. (0 = False (Default), 1 = True)

[SponsorCars]
EnableInCustomize = 0               // Adds a category to the customize car select holding the game's preset cars, sponsor cars included, so they can be taken into the Body Shop. (0 = False (Default), 1 = True)
EnableInQuickRace = 0               // The same category in Quick Race. Vanilla only ever offers the eight sponsor cars there, and only after a cheat; this adds the rest of the preset list (story cars, crew cars, the DEMO_* entries). (0 = False (Default), 1 = True)
UnlockWithoutCheats = 0             // Makes the game behave as if every sponsor car cheat had been entered. (0 = False (Default), 1 = True)

[CarCategories]
CopCars = 0                         // Adds a Cop Cars category to the car select, listing every car type whose usage byte says cop. The category is not offered in customize: these cars are not sold, so there is no STOCK_<name> record to build a tuned car from. Add one and they become customizable like any other car. (0 = False (Default), 1 = True)
TrafficCars = 0                     // Same for traffic cars. Note that traffic models carry only what their own parts define, so most of them have wheels to change and little else. (0 = False (Default), 1 = True)
ShowCarNames = 0                    // Shows the car name under the car in every car select category, not just the ones added here. (0 = False (Default), 1 = True)

[Debug]
DisableTextureReplacement = 0       // Disables any texture replacement done by Unlimiter. (0 = False (Default), 1 = True)
DisableLightFlareColors = 1         // Disables custom light flare colors feature. [Not completed yet] (0 = False, 1 = True (Default))
DisableExhaustFlameAndTireSmoke = 0 // Disables Exhaust Flame and Tire Smoke colors features. (0 = False (Default), 1 = True)
DisableUnlimiterEmitter = 0         // Disables custom acid effects and emitters used by Unlimiter instead of the vanilla ones with Exhaust Flame. (0 = False (Default), 1 = True)
ForceLightFlaresOn = 0              // Only works when DisableLightFlareColors set to 0. (7 = Headlights, 56 = Taillights, 28672 = Cop Lights, etc. [Check the source code for flare flags.])
ExportCameraInfo = 0                // Exports camera info as ini files into UnlimiterData\CameraInfo. Overwrites existing files. Gets disabled automatically after the data gets exported. (0 = False (Default), 1 = True)
EnableReleasePrintf = 0             // Prints debug info into the game's console. Note: The console should get allocated and attached via 3rd party tools. (0 = False (Default), 1 = True)

[Trace]
PartLinkTrace = 0                   // Writes UnlimiterData\_PartLinkTrace.txt: every HIDESLOT / SWAPSLOT attribute the resolve reads off a part, and which slots the Body Shop then treats as governed. (0 = False (Default), 1 = True)
EngineBankTrace = 0                 // Writes UnlimiterData\_EngineBankTrace.txt: the engine sound entry each car asks for, and the one it ends up with after the six slot bank cache at 0x82A5A0 has had its say. A line marked SUBSTITUTED means the car was handed a different car's engine because its own bank was not loaded. For chasing wrong or doubled engine sounds. (0 = False (Default), 1 = True)
GarageFilterTrace = 0               // Writes UnlimiterData\_GarageFilter.txt: for each part the garage filter looks at, the customize entry point, whether a career car was found, whether the part is installed and whether the inventory says it is owned. For working out why GarageShowsOwnedPartsOnly is not biting. (0 = False (Default), 1 = True)
