# This ini file is used to define which rim brands will appear with which order in the customization shop.
# It also allows you to have some other options.
#
# You can add more brands or overwrite the existing ones if you add ini files for each brand into the RimBrands directory. (See _example.notini for details)
#
# First section
#     NumberOfRimBrands = Defines the number of rim brands (without including 0) to get read from this file.
#     RemoveRimSizeRestrictions = Removes the outer radius restriction to make any rim available for all cars.
#
# Rim Brands sections (BrandX)
#     Required
#          BrandName = Defines the BRAND_NAME attribute value. If a rim car part has the attribute with the same value, it will appear under this brand.
#          String = Defines which string will be used in the menu. Only accepts labels.
#          Texture = Defines which icon will be used in the menu. Only accepts texture names.
#     Optional
#          NoRimSize = Removes size selection and lists all rims seperately.
#          HideBrandName = Hides rim brand name before the model name.
#          AvailableForRegularCars = Shows the rim brand for regular (Non-SUV) cars.
#          AvailableForSUVs = Shows the rim brand for SUV cars.

[RimBrands]
NumberOfRimBrands = 29
RemoveRimSizeRestrictions = 0

[Brand0]
BrandName = "CUSTOM"
String = "RIMS_BRAND_CUSTOM"
Texture = "VISUAL_RIMS_BRAND_STOCK"
NoRimSize = 1
HideBrandName = 0
AvailableForRegularCars = 1
AvailableForSUVs = 1

