# Section name = the preset's own name. Every key is optional; a preset with no section keeps
# the game's name and list position. Enabled = 0 hides it,
# DisplayName replaces the label, Group 0-3 puts it in one of the four car select categories.
# OnlyListedPresets = 1 turns this file into a whitelist.
#
# Order is the order of this file. Move a section, move the car. Presets with no section here
# come after the listed ones, in the order the game holds them.
#
#   UnlockCondition = None      always available (default)
#   UnlockCondition = Code      only after UnlockValue has been typed on the start screen
#   UnlockValue = yodogg        the code itself; case does not matter
#
# The eight sponsor cars have their code commented out below, so they show up straight away.
# Uncomment a pair to put that car back behind its cheat. The game's own codes are:
#   yodogg  gimmechingy  wannacapone  wantmyd3
#   shinestreetbright  davidchoeart  tunejapantuning  opendoors
#
# The rest of the game's codes, for reference: needperformance1, needperformance2, gimmevisual1,
# gimmevisual2, needmybestbuy, goforoldspice, gottaedge, gottahavebk, gotmycingular, regmybank,
# regmebaby, ordermebaby

[PresetCars]
OnlyListedPresets = 0
GroupName0 = Sponsor Cars
GroupName1 = Boss Cars
GroupName2 = Debug Cars
GroupName3 = Other Cars

